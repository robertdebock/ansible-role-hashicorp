---
galaxy_info:
  author: robertdebock
  role_name: hashicorp
  description: Install HashiCorp products using packages.
  license: Apache-2.0
  company: none
  min_ansible_version: "2.12"

  platforms:
    - name: EL
      versions:
        - "9"
    - name: Debian
      versions:
        - all
    - name: Fedora
      versions:
        # HashiCorp does not publish packages for rawhide or the very latest Fedora.
        - "44"
    - name: Ubuntu
      versions:
        - noble
        - jammy

  galaxy_tags:
    - hashicorp
    - consul
    - nomad
    - terraform
    - vagrant
    - vault

dependencies: []
